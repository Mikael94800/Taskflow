                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('Export PNG réussi', 'success');
            } catch (e) {
                console.error('Export error:', e);
                showToast('Erreur export PNG', 'error');
            }
        }
        
        const showSaveIndicator = () => { const el = document.getElementById('saveIndicator'); el.classList.add('visible'); clearTimeout(saveTimeout); saveTimeout = setTimeout(() => el.classList.remove('visible'), 1500); };
        const escapeHtml = (t) => { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
        const gristToDate = (ts) => ts ? new Date(ts * 1000) : null;
        const dateToGrist = (d) => d ? Math.floor(d.getTime() / 1000) : null;
        const formatDateInput = (d) => d ? d.toISOString().split('T')[0] : '';
        // BUG-01 FIX: Parsing robuste des dates depuis input type="date" (évite problème timezone UTC)
        const parseInputDate = (str) => {
            if (!str) return null;
            const parts = str.split('-');
            if (parts.length !== 3) return null;
            const [y, m, d] = parts.map(Number);
            if (!y || !m || !d || isNaN(y) || isNaN(m) || isNaN(d)) return null;
            return new Date(y, m - 1, d, 12, 0, 0); // Midi heure locale pour éviter les décalages
        };
        const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
        const getProjectName = (id) => { const p = projects.find(x => x.id === id); return p?.nom || ''; };
        const getProjectColor = (id) => { const p = projects.find(x => x.id === id); return p?.couleur || '#64748b'; };
        const getProjectTextColor = (hex) => {
            const h = String(hex || '#94a3b8').replace('#','');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const r = parseInt(full.slice(0,2),16) || 148, g = parseInt(full.slice(2,4),16) || 163, b = parseInt(full.slice(4,6),16) || 184;
            const lum = (0.299*r + 0.587*g + 0.114*b);
            return lum > 160 ? '#172033' : '#ffffff';
        };
        const getTeamMemberName = (id) => { const m = team.find(x => x.id === id); return m?.nom || ''; };
        // TEAM-01: Couleur personnalisée par membre
        const getTeamMemberColor = (id) => { const m = team.find(x => x.id === id); return m?.couleur || '#3e5de7'; };  // Défaut: primary
        const getInitials = (n) => n ? n.split(' ').map(x => x[0]).join('').toUpperCase().slice(0, 2) : '?';
        const getRefListArray = (val) => { if (!val) return []; if (Array.isArray(val)) return val[0] === 'L' ? val.slice(1).map(Number).filter(n => !isNaN(n)) : val.map(Number).filter(n => !isNaN(n)); return []; };
        const toGristRefList = (arr) => arr && arr.length ? ['L', ...arr] : null;
        const getChoiceListArray = (val) => { if (!val) return []; if (Array.isArray(val)) return val[0] === 'L' ? val.slice(1) : val; return []; };
        const toGristChoiceList = (arr) => arr && arr.length ? ['L', ...arr] : null;
        const getAssignees = (t) => getRefListArray(t?.assignees);
        const getDependsOn = (t) => getRefListArray(t?.dependDe);
        const getTags = (t) => getChoiceListArray(t?.tags);
        const getPriority = (t) => (t?.priorite >= 1 && t?.priorite <= 4) ? parseInt(t.priorite) : 3;
        function getTaskColor(t) {
            if (t?.couleur && /^#[0-9a-f]{3,8}$/i.test(t.couleur)) return t.couleur;
            switch (colorMode) {
                case 'project': return t?.projet ? getProjectColor(t.projet) : '#94a3b8';
                case 'assignee': { const a = getAssignees(t); return a.length ? getTeamMemberColor(a[0]) : '#94a3b8'; }
                case 'status': return TF.getStatus(statusCfg, t?.statut || statusCfg.firstValue).fillColor;
                case 'priority':
                default: return PRIORITY_COLORS[getPriority(t)];
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // WBS (hiérarchie sous-tâches) — API commune
        // ═══════════════════════════════════════════════════════════════════════
        let childrenByParent = new Map();
        function rebuildChildrenCache() {
            childrenByParent = new Map();
            const cycleIds = new Set();
            for (const t of tasks) {
                const seen = new Set([t.id]);
                let cur = t.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
                let guard = 0;
                while (cur && guard++ < 128) {
                    if (seen.has(cur.id)) { cycleIds.add(t.id); break; }
                    seen.add(cur.id);
                    cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
                }
            }
            if (cycleIds.size) console.warn('WBS: cycles detected on task ids:', [...cycleIds]);
            for (const t of tasks) {
                const pid = t.parentTask;
                if (pid && !isNaN(pid) && !cycleIds.has(t.id)) {
                    if (!childrenByParent.has(pid)) childrenByParent.set(pid, []);
                    childrenByParent.get(pid).push(t);
                }
            }
        }
        const isRoot = (t) => !t?.parentTask;
        const getParent = (t) => t?.parentTask ? tasks.find(x => x.id === t.parentTask) : null;
        const getChildren = (id) => childrenByParent.get(id) || [];
        const hasChildren = (t) => t && getChildren(t.id).length > 0;
        function getDepth(t) { let d = 0, cur = t, guard = 0; while (cur?.parentTask && guard++ < 32) { cur = tasks.find(x => x.id === cur.parentTask); d++; } return d; }
        function walkTree(roots, cb) {
            const stack = roots.map(r => ({ task: r, depth: 0 }));
            while (stack.length) {
                const { task, depth: d } = stack.shift();
                cb(task, d);
                const kids = getChildren(task.id);
                if (kids.length) for (let i = kids.length - 1; i >= 0; i--) stack.unshift({ task: kids[i], depth: d + 1 });
            }
        }
        function getAllDescendants(id, acc = [], visited = new Set()) {
            if (visited.has(id)) return acc;
            visited.add(id);
            for (const k of getChildren(id)) { acc.push(k); getAllDescendants(k.id, acc, visited); }
            return acc;
        }
        function canSetParent(taskId, newParent) {
            if (!newParent) return true;
            if (newParent === taskId) return false;
            let cur = tasks.find(x => x.id === newParent), guard = 0;
            while (cur && guard++ < 64) {
                if (cur.id === taskId) return false;
                cur = cur.parentTask ? tasks.find(x => x.id === cur.parentTask) : null;
            }
            return true;
        }
        function aggregateProgress(t, visited = new Set()) {
            if (visited.has(t.id)) return t.progression || 0;
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return t.progression || 0;
            const allWeighted = kids.every(k => k.estimationH && k.estimationH > 0);
            if (allWeighted) {
                const totalW = kids.reduce((s, k) => s + k.estimationH, 0);
                return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited) * k.estimationH, 0) / totalW);
            }
            return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited), 0) / kids.length);
        }
        function aggregateDates(t, visited = new Set()) {
            if (visited.has(t.id)) return { start: t.dateDebut, end: t.dateEcheance };
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return { start: t.dateDebut, end: t.dateEcheance };
            let minS = t.dateDebut, maxE = t.dateEcheance;
            for (const k of kids) {
                const sub = aggregateDates(k, visited);
                if (sub.start != null && (minS == null || sub.start < minS)) minS = sub.start;
                if (sub.end != null && (maxE == null || sub.end > maxE)) maxE = sub.end;
            }
            return { start: minS, end: maxE };
        }

        function wouldCreateCycle(taskId, depId, visited = new Set()) { if (taskId === depId) return true; if (visited.has(depId)) return false; visited.add(depId); const depTask = tasks.find(t => t.id === depId); if (!depTask) return false; return getDependsOn(depTask).some(d => wouldCreateCycle(taskId, d, visited)); }
        function getAvailableDependencies(taskId) { return tasks.filter(t => t.id !== taskId && !wouldCreateCycle(taskId, t.id)); }
        function getBlockedTasks(taskId) { return tasks.filter(t => getDependsOn(t).includes(taskId)); }

        function convertGristToRecords(data) { if (!data || Array.isArray(data)) return data || []; const cols = Object.keys(data); if (!cols.length) return []; const n = data[cols[0]]?.length || 0; const records = []; for (let i = 0; i < n; i++) { const rec = {}; cols.forEach(k => { rec[k] = data[k][i]; }); records.push(rec); } return records; }
        // sweet spot : ne jamais ecrire une colonne absente du schema (ex. charges/dateCloture si le Plan n'a jamais ete ouvert). Fail-open si TASK_COLS pas encore peuple.
        function pruneTaskRecord(rec) { if (TASK_COLS.size) { for (const k in rec) if (!TASK_COLS.has(k)) delete rec[k]; } return rec; }
        async function ensureSchema() { let created = 0; const tablesCreated = []; for (const [tableName, columns] of Object.entries(TASKFLOW_SCHEMA)) { let existingCols = [], tableExists = false; try { const data = await grist.docApi.fetchTable(tableName); existingCols = Object.keys(data).filter(c => c !== 'id' && c !== 'manualSort'); tableExists = true; } catch (e) { try { await grist.docApi.applyUserActions([['AddTable', tableName, columns.map(c => ({ id: c.id, type: c.type }))]]); tablesCreated.push(tableName); created++; continue; } catch (e2) { continue; } } if (tableExists) { const missing = columns.filter(c => !existingCols.includes(c.id)); for (const col of missing) { try { await grist.docApi.applyUserActions([['AddColumn', tableName, col.id, { type: col.type }]]); } catch (e) {} } } } if (tablesCreated.includes('Tasks')) await seedData();
            // #1 : semer les statuts par defaut (choix + couleurs) sur la colonne Choice si vierge
            await TF.seedStatusChoices(grist, 'Tasks', 'statut', TF.DEFAULT_STATUSES);
            // #2 : afficher les NOMS plutot que les IDs dans les vues natives Grist (defensif, idempotent)
            await TF.setRefDisplayColumns(grist, [
                { table: 'Tasks',    column: 'projet',      visibleColId: 'nom' },
                { table: 'Tasks',    column: 'assignees',   visibleColId: 'nom' },

                { table: 'Projects', column: 'responsable', visibleColId: 'nom' }
            ]);
        }

        async function loadAllData() {
            try { const _raw = await grist.docApi.fetchTable('Tasks'); TASK_COLS = new Set(Object.keys(_raw || {})); tasks = convertGristToRecords(_raw); } catch (e) { tasks = []; }
            try { team = convertGristToRecords(await grist.docApi.fetchTable('Team')); } catch (e) { team = []; }
            try { projects = convertGristToRecords(await grist.docApi.fetchTable('Projects')); } catch (e) { projects = []; }
            // V3 : l'ordre des projets est conservé dans Projects.ordre.
            projects = sortProjectsByOrder(projects);
            if (gristReady || !projects.length) { /* rien */ }
            gristReady = true;
            rebuildChildrenCache();
            try { statusCfg = await TF.loadStatusConfig(grist, 'Tasks', 'statut', tasks.map(t => t && t.statut)); } catch (e) {}

        function sortProjectsByOrder(list) {
            return [...(list || [])].sort((a,b) => {
                const ao = Number.isFinite(Number(a.ordre)) ? Number(a.ordre) : Number.POSITIVE_INFINITY;
                const bo = Number.isFinite(Number(b.ordre)) ? Number(b.ordre) : Number.POSITIVE_INFINITY;
                if (ao !== bo) return ao - bo;
                return (a.id || 0) - (b.id || 0);
            });
        }

        async function persistInitialProjectOrder() {
            if (!gristReady || !projects.length || TF.isReadOnly()) return;
            const missing = projects.filter(p => !Number.isFinite(Number(p.ordre)));
            if (!missing.length) return;
            try {
                const actions = projects.map((p, i) => ['UpdateRecord','Projects',p.id,{ordre:(i+1)*1000}]);
                await grist.docApi.applyUserActions(actions);
                projects = projects.map((p,i) => ({...p, ordre:(i+1)*1000}));
            } catch (e) { console.warn('Initialisation ordre projets impossible:', e); }
        }

        async function reorderProjectsByIds(orderedIds) {
            const byId = new Map(projects.map(p => [Number(p.id), p]));
            const ordered = orderedIds.map(id => byId.get(Number(id))).filter(Boolean);
            const rest = projects.filter(p => !orderedIds.includes(Number(p.id)));
            projects = [...ordered, ...rest];
            const actions = projects.map((p,i) => ['UpdateRecord','Projects',p.id,{ordre:(i+1)*1000}]);
            if (gristReady && !TF.isReadOnly()) {
                try { await grist.docApi.applyUserActions(actions); showSaveIndicator(); }
                catch (e) { showToast('Impossible d’enregistrer l’ordre des projets','error'); await loadAllData(); return; }
            }
            render();
        }

        function getFilteredTasks() {
            return tasks.filter(t => {

                if (workLevel === 'actions') { if (hasChildren(t)) return false; }
                else if (workLevel === 'parents') { if (!hasChildren(t)) return false; }
                // WBS-03 (niveau 'all' uniquement) : par défaut afficher uniquement les racines (pas les sous-tâches)
                else if (!showSubtasks && t.parentTask) return false;
                if (filters.project.length && !filters.project.includes(t.projet)) return false;
                if (filters.priority.length && !filters.priority.includes(getPriority(t))) return false;
                if (filters.assignee.length && !getAssignees(t).some(a => filters.assignee.includes(a))) return false;
                if (filters.status.length && !filters.status.includes(t.statut || 'todo')) return false;

                    if(idVal) await grist.docApi.applyUserActions([['UpdateRecord','Projects',Number(idVal),record]]); else { const r=await grist.docApi.applyUserActions([['AddRecord','Projects',null,{...record,ordre:(projects.length+1)*1000}]]); record.id=Array.isArray(r?.retValues)?r.retValues[0]:null; }
                }
                if(idVal){ const p=projects.find(x=>Number(x.id)===Number(idVal)); if(p)Object.assign(p,record,{id:p.id}); }
                else { const nextId=projects.reduce((m,p)=>Math.max(m,Number(p.id)||0),0)+1; projects.push({...record,id:record.id||nextId,ordre:(projects.length+1)*1000}); }
                projects=sortProjectsByOrder(projects); closeProjectEditor(); renderProjectManager(); updateFilterMenus(); render(); showToast(idVal?'Projet modifié':'Projet créé','success');
            }catch(e){console.error(e);showToast('Impossible d’enregistrer le projet','error');}
        }
        async function toggleProjectActive(id){
            const p=projects.find(x=>Number(x.id)===Number(id)); if(!p)return; const next=p.actif===false; 
            try{ if(gristReady)await grist.docApi.applyUserActions([['UpdateRecord','Projects',p.id,{actif:next}]]); p.actif=next; renderProjectManager(); updateFilterMenus(); render(); showToast(next?'Projet réactivé':'Projet désactivé','success'); }catch(e){showToast('Impossible de modifier le projet','error');}
        }
        async function deleteProject(id){
            const p=projects.find(x=>Number(x.id)===Number(id)); if(!p)return; const count=projectTaskCount(id);
            if(count>0){showToast(`Impossible de supprimer « ${p.nom} » : ${count} tâche${count>1?'s':''} y est liée. Désattribuez-les ou transférez-les d’abord.`,'error');return;}
            if(!confirm(`Supprimer le projet « ${p.nom} » ?`))return;
            try{if(gristReady)await grist.docApi.applyUserActions([['RemoveRecord','Projects',p.id]]);projects=projects.filter(x=>Number(x.id)!==Number(id));renderProjectManager();updateFilterMenus();render();showToast('Projet supprimé','success');}catch(e){showToast('Impossible de supprimer le projet','error');}

        // ═══════════════════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════════════════
        function getNavigationTasks() {
            const ft = getFilteredTasks();
            if (groupBy === 'projet') {
                return buildColumns(ft).flatMap(col => col.tasks);
            }
            return ft;
        }

        function renderTaskBottomNav() {
            const host=document.getElementById('taskBottomNav');
            if(!host)return;
            const list=getNavigationTasks();
            const total=list.length;
            if(total<2){host.style.display='none';host.innerHTML='';return;}
            let idx=panelState.open && !panelState.isNew ? list.findIndex(t=>t.id===panelState.taskId) : list.findIndex(t=>t.id===selectedTaskId);
            if(idx<0) idx=0;
            const pct=total>1?(idx/(total-1))*100:0;
            host.style.display='flex';
            host.innerHTML=`<div class="task-bottom-nav-inner"><button class="task-bottom-nav-btn" onclick="navigateGlobalTask(-1)" aria-label="Tâche précédente">‹</button><div class="task-bottom-track"><div class="task-bottom-fill" style="width:${pct}%"></div></div><span class="task-bottom-label">${idx+1} / ${total}</span><div class="task-bottom-track"><div class="task-bottom-fill" style="width:${pct}%"></div></div><button class="task-bottom-nav-btn" onclick="navigateGlobalTask(1)" aria-label="Tâche suivante">›</button></div>`;
        }

        function navigateGlobalTask(dir) {
            const list=getNavigationTasks();
            if(list.length<2)return;
            let idx=list.findIndex(t=>t.id===(panelState.open ? panelState.taskId : selectedTaskId));
            if(idx<0) idx=dir>0 ? -1 : 0;
            idx=(idx+dir+list.length)%list.length;
            const t=list[idx];
            if(t) {
                openTaskPanel(t.id, {floating: !!panelState.floating});
                if (groupBy === 'projet') {
                    requestAnimationFrame(() => {
                        const container = document.getElementById('kanbanContainer');
                        const col = container && container.querySelector(`.project-column[data-key="${t.projet ?? 'none'}"]`);
                        if (container && col) {
                            const target = Math.max(0, col.offsetLeft - Math.max(40, container.clientWidth * 0.18));
                            container.scrollTo({left: target, behavior: 'smooth'});
                        }
                    });
                }
            }
        }

        function render() {
            sortableInstances.forEach(s => s.destroy());
            sortableInstances = [];
            if (projectSortableInstance) { projectSortableInstance.destroy(); projectSortableInstance = null; }
            const container = document.getElementById('kanbanContainer');
            const ft = getFilteredTasks();
            const columns = buildColumns(ft);
            
            container.innerHTML = columns.map(col => `
                <div class="kanban-column ${groupBy === 'projet' && col.key !== 'none' ? 'project-column' : ''}" data-key="${col.key}">
                    <div class="column-header ${groupBy === 'projet' && col.key !== 'none' ? 'project-drag-handle' : ''}" ${groupBy === 'projet' && col.key !== 'none' ? 'title="Faire glisser pour déplacer le projet"' : ''}>
                        <span class="column-title">${col.icon || ''} <span class="project-title-text">${escapeHtml(col.label)}</span> <span class="column-count">${col.tasks.length}</span></span>
                        <button class="column-add" onclick="event.stopPropagation();openCreatePanelForColumn('${col.key}')" title="Ajouter">+</button>
                    </div>
                    <div class="column-body ${col.tasks.length ? '' : 'is-empty'}" id="col-${col.key}">${col.tasks.length ? col.tasks.map(t => renderCard(t)).join('') : renderEmptyColumn(col)}</div>
                </div>
            `).join('');
            
            // Sortable des tâches
            columns.forEach(col => {
                const el = document.getElementById(`col-${col.key}`);
                if (el) {
                    sortableInstances.push(new Sortable(el, {
                        group: 'tasks', animation: 150, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen',
                        onEnd: (evt) => handleDrop(evt)
                    }));
                }
            });

            // V3 : en regroupement Projet, les colonnes/projets eux-mêmes sont déplaçables.
            if (groupBy === 'projet') {
                projectSortableInstance = new Sortable(container, {
                    animation: 180,
                    draggable: '.project-column',
                    handle: '.project-drag-handle',
                    ghostClass: 'project-sortable-ghost',
                    chosenClass: 'project-sortable-chosen',
                    filter: '.column-add, .task-card, .column-body',
                    preventOnFilter: true,
                    onEnd: async (evt) => {
                        if (evt.oldIndex === evt.newIndex) return;
                        const ids = [...container.querySelectorAll('.project-column')].map(el => Number(el.dataset.key)).filter(Number.isFinite);
                        await reorderProjectsByIds(ids);
                    }
                });
            }
            renderTaskBottomNav();
        }

        function buildColumns(ft) {
            if (groupBy === 'statut') {
                return statusCfg.list.map(s => ({ key: s.value, label: s.label, icon: '', tasks: ft.filter(t => t.statut === s.value) }));
            } else if (groupBy === 'priorite') {
                return [1,2,3,4].map(p => ({ key: String(p), label: PRIORITY_LABELS[p], icon: '', tasks: ft.filter(t => getPriority(t) === p) }));
            } else if (groupBy === 'projet') {
                const cols = projects.filter(p => p.actif !== false).map(p => ({ key: String(p.id), label: p.nom, icon: `<span style="color:${p.couleur}">●</span>`, tasks: ft.filter(t => t.projet === p.id) }));
                cols.push({ key: 'none', label: 'Sans projet', icon: '', tasks: ft.filter(t => !t.projet) });
                return cols;
            }
            return [];
        }

        function renderSubtaskPreview(t, depth = 0) {
            const done = TF.isTerminal(statusCfg, t.statut) || Number(t.progression || 0) >= 100;
            const stateClass = done ? 'done' : (String(t.statut || '') === 'inprogress' ? 'inprogress' : 'pending');
            const stateLabel = done ? '✓ Terminée' : (stateClass === 'inprogress' ? 'En cours' : 'À venir');
            const prog = Math.max(0, Math.min(100, Number(t.progression || 0)));
            const d0 = t.dateDebut ? gristToDate(t.dateDebut) : null;
            const d1 = t.dateEcheance ? gristToDate(t.dateEcheance) : null;
            const fmt = d => d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : '';
            const dates = d0 || d1 ? `${fmt(d0)}${d0 && d1 ? ' → ' : ''}${fmt(d1)}` : '';
            const aa = getAssignees(t);
            const who = aa.length ? getInitials(getTeamMemberName(aa[0])) : '';
            const whoTitle = aa.length ? aa.map(id => getTeamMemberName(id)).filter(Boolean).join(', ') : '';
            const children = showSubtasks && depth < 2 ? getChildren(t.id) : [];
            return `<div class="tf-subtask-preview ${stateClass}" data-id="${t.id}" onclick="event.stopPropagation();handleTaskCardClick(event, ${t.id})" title="Ouvrir la sous-tâche">
                <div class="tf-subtask-head">
                    <span class="tf-subtask-check">✓</span>
                    <span class="tf-subtask-title">↳ ${escapeHtml(t.titre || 'Sans titre')}</span>
                    <span class="tf-subtask-state ${stateClass}">${stateLabel}</span>
                    <span class="tf-subtask-alert-slot" aria-hidden="true"></span>
                </div>
                <div class="tf-subtask-meta">
                    ${dates ? `<span>📅 ${dates}</span>` : ''}
                    ${who ? `<span class="tf-subtask-assignee" title="${escapeHtml(whoTitle)}">${escapeHtml(who)}</span>` : ''}
                    <span>${prog}%</span>
                </div>
                <div class="tf-subtask-progress"><span style="width:${prog}%"></span></div>
                ${children.length ? `<div class="tf-hierarchy-children tf-subtask-children">${children.map(k => renderSubtaskPreview(k, depth + 1)).join('')}</div>` : ''}
            </div>`;
        }

        function renderCard(t) {
            const p = getPriority(t);
            const assignees = getAssignees(t);
            const deps = getDependsOn(t);
            const projectName = getProjectName(t.projet);
            const projectColor = getProjectColor(t.projet);
            const typeIcon = TYPE_ICONS[t.type] || '';
            const subs = getSubtasks(t);
            const subsDone = subs.filter(s => s.done).length;
            const nChildren = getChildren(t.id).length;
            const isChild = !!t.parentTask;
            const barColor = getTaskColor(t);
            const prog = t.progression || 0;
            let dueHtml = '';
            if (t.dateEcheance && t.type !== 'jalon') {
                const _e = gristToDate(t.dateEcheance);
                if (_e) {
                    const _t0 = new Date(); _t0.setHours(0,0,0,0);
                    const _d = new Date(_e); _d.setHours(0,0,0,0);
                    const _days = Math.round((_d - _t0) / 86400000);
                    const _done = TF.isTerminal(statusCfg, t.statut);
                    const _st = _done ? '' : _days < 0 ? 'over' : _days <= 2 ? 'soon' : '';
                    const _MO = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
                    dueHtml = `<span class="tf-due ${_st}">${_d.getDate()} ${_MO[_d.getMonth()]}</span>`;
                }
            }
            const children = showSubtasks && !isChild ? getChildren(t.id) : [];
            return `<div class="task-card p${p} ${TF.isTerminal(statusCfg, t.statut) ? 'done' : ''} ${t.id === selectedTaskId ? 'selected' : ''}" data-id="${t.id}" style="border-left-color:${barColor}" onclick="handleTaskCardClick(event, ${t.id})">
                <div class="card-header">
                    <span class="card-title">${isChild ? '↳ ' : ''}${escapeHtml(t.titre) || 'Sans titre'}${children.length ? `<span class="tf-hierarchy-count">${children.length}</span>` : ''}</span>
                    ${typeIcon ? `<span class="card-type">${typeIcon}</span>` : ''}
                    <span class="tf-alert-slot" aria-hidden="true"></span>
                </div>
                <div class="card-meta">
                    <span class="tf-badge tf-p${p}">${PRIORITY_LABELS[p]}</span>
                    ${projectName ? `<span class="card-project"><span style="color:${projectColor}">●</span> ${escapeHtml(projectName)}</span>` : ''}
                    ${deps.length ? `<span class="card-deps">← ${deps.length}</span>` : ''}
                    ${subs.length ? `<span class="card-subs${subsDone === subs.length ? ' complete' : ''}" title="Checklist">◎ ${subsDone}/${subs.length}</span>` : ''}
                    ${nChildren ? `<span class="card-subs" title="Sous-tâches (hiérarchie)">↳ ${nChildren}</span>` : ''}
                    ${dueHtml}
                </div>
                ${t.type !== 'jalon' ? `<div class="card-progress-row"><div class="card-progress" onclick="event.stopPropagation();setCardProgress(event, ${t.id})"><div class="card-progress-fill p${p}" style="width:${prog}%"></div></div><span class="card-progress-pct">${prog}%</span></div>` : ''}
                ${assignees.length ? `<div class="card-assignees">${assignees.slice(0, 3).map(id => `<div class="card-avatar" style="background:${getTeamMemberColor(id)}" title="${escapeHtml(getTeamMemberName(id))}">${getInitials(getTeamMemberName(id))}</div>`).join('')}${assignees.length > 3 ? `<div class="card-avatar more">+${assignees.length - 3}</div>` : ''}</div>` : ''}
                ${children.length ? `<div class="tf-hierarchy-children">${children.map(k => renderSubtaskPreview(k)).join('')}</div>` : ''}
            </div>`;
        }

        async function handleDrop(evt) {
            const taskId = parseInt(evt.item.dataset.id);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // Lire la colonne de destination depuis evt.to (le conteneur d'arrivée).
            // Utiliser col.key capturée en closure donnerait la source, pas la destination.
            const colKey = (evt.to && evt.to.id) ? evt.to.id.replace(/^col-/, '') : null;
            if (colKey === null) return;

            let updates = {};
            if (groupBy === 'statut') { updates.statut = colKey; const _wasT = TF.isTerminal(statusCfg, task.statut), _nowT = TF.isTerminal(statusCfg, colKey); if (_nowT) { updates.progression = 100; if (!_wasT) updates.dateCloture = Math.floor(Date.now() / 1000); } else if (_wasT) updates.dateCloture = null; }
            else if (groupBy === 'priorite') updates.priorite = parseInt(colKey, 10);
            else if (groupBy === 'projet') updates.projet = colKey === 'none' ? null : parseInt(colKey, 10);
            
            Object.assign(task, updates);
            
            if (gristReady) {
                try { await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, pruneTaskRecord(updates)]]); showSaveIndicator(); }
                catch (e) { showToast('Erreur déplacement', 'error'); await loadAllData(); }
            }
            render();  // garde les états vides cohérents après un déplacement
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PANEL
        // ═══════════════════════════════════════════════════════════════════════
        function openPanel() { 
            panelState.open = true; 
            const panel = document.getElementById('panel');
            const floating = !!panelState.floating;
            document.body.classList.toggle('task-panel-open', !floating);
            panel.classList.toggle('shift-floating', floating);
            panel.classList.add('open'); 
            document.getElementById('kanbanContainer').classList.toggle('panel-open', !floating); 
            document.getElementById('panelOverlay').classList.toggle('visible', !floating);
            renderTaskBottomNav();
        }
        function closePanel() { 
            panelState.open = false; 
            document.body.classList.remove('task-panel-open');
            document.getElementById('panel').classList.remove('open','shift-floating'); 
            document.getElementById('kanbanContainer').classList.remove('panel-open'); 
            document.getElementById('panelOverlay').classList.remove('visible');
            panelState = { open: false, isNew: false, floating: false, taskId: null, taskIndex: -1, columnTasks: [], columnKey: null, editData: null }; 
            selectedTaskId = null; 
            renderTaskBottomNav();
            render(); 
        }
        // BUG-04 FIX: Confirmation avant fermeture si nouvelle tâche non sauvegardée
        function confirmClosePanel() {
            if (panelState.isNew && panelState.editData?.titre?.trim()) {
                if (confirm('Fermer sans créer la tâche ?')) closePanel();
            } else {
                closePanel();
            }
        }

        function openTaskPanel(taskId, options = {}) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            selectedTaskId = taskId;
            
            // Navigation : en mode Projet, parcourir toutes les tâches filtrées
            // pour pouvoir passer d'un projet à l'autre sans fermer le panneau.
            const ft = getFilteredTasks();
            const columns = buildColumns(ft);
            let colKey = null, colTasks = [];
            if (groupBy === 'projet') {
                colTasks = columns.flatMap(col => col.tasks);
                const found = columns.find(col => col.tasks.some(t => t.id === taskId));
                colKey = found ? found.key : null;
            } else {
                for (const col of columns) {
                    const idx = col.tasks.findIndex(t => t.id === taskId);
                    if (idx !== -1) { colKey = col.key; colTasks = col.tasks; break; }
                }
            }
            
            panelState.floating = !!options.floating;
            panelState.taskId = taskId;
            panelState.taskIndex = colTasks.findIndex(t => t.id === taskId);
            panelState.columnTasks = colTasks;
            panelState.columnKey = colKey;
            panelState.isNew = false;
            panelState.editData = cloneTaskData(task);
            renderPanelTask();
            openPanel();
            if (gristReady) grist.setSelectedRows([taskId]);
            render();
        }

        function openCreatePanel() { openCreatePanelForColumn(groupBy === 'statut' ? 'todo' : groupBy === 'priorite' ? '3' : projects.length ? String(projects[0].id) : 'none'); }

        function openCreatePanelForColumn(colKey) {
            const today = new Date();
            let preset = {};
            if (groupBy === 'statut') preset.statut = colKey;
            else if (groupBy === 'priorite') preset.priorite = colKey;
            else if (groupBy === 'projet') preset.projet = colKey === 'none' ? null : parseInt(colKey);

            panelState = {
                open: true, isNew: true, floating: false, taskId: null, taskIndex: -1, columnTasks: [], columnKey: colKey,
                editData: { titre: '', description: '', type: 'tache', priorite: preset.priorite || '3', statut: preset.statut || 'todo', progression: 0, dateDebut: dateToGrist(today), dateEcheance: dateToGrist(addDays(today, 7)), projet: preset.projet !== undefined ? preset.projet : (projects.length > 0 ? projects[0].id : null), assignees: [], dependDe: [], tags: [], estimationH: null, tempsPasse: null, subtasks: [], couleur: null, parentTask: null, charges: [] }
            };
            renderPanelTask();
            openPanel();
            render();
            setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
        }
        // WBS-03: création d'une sous-tâche
        function openCreateTaskWithParent(parentId) {
            const today = new Date();
            const parent = parentId ? tasks.find(t => t.id === parentId) : null;
            panelState = {
                open: true, isNew: true, floating: false, taskId: null, taskIndex: -1, columnTasks: [], columnKey: null,
                editData: { titre: '', description: '', type: 'tache', priorite: '3', statut: 'todo', progression: 0, dateDebut: dateToGrist(today), dateEcheance: dateToGrist(addDays(today, 7)), projet: parent?.projet || (projects.length > 0 ? projects[0].id : null), assignees: [], dependDe: [], tags: [], estimationH: null, tempsPasse: null, subtasks: [], couleur: null, parentTask: parentId || null, charges: [] }
            };
            renderPanelTask();
            openPanel();
            render();
            setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
        }
        async function detachFromParent() {
            // V14: Transformer une sous-tâche en tâche principale.
            // On conserve toutes les autres données de la tâche et son projet.
            if (panelState.isNew || !panelState.taskId || !gristReady) {
                if (panelState.editData) {
                    panelState.editData.parentTask = null;
                    syncLocalTask();
                    renderPanelTask();
                    render();
                }
                return;
            }

            const taskId = panelState.taskId;
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // Mémoriser le projet et les données locales avant la transformation.
            const projectId = task.projet || panelState.editData?.projet || null;
            if (panelState.editData) panelState.editData.parentTask = null;
            task.parentTask = null;

            try {
                // On ne crée PAS une nouvelle ligne : la même tâche devient simplement racine.
                await grist.docApi.applyUserActions([
                    ['UpdateRecord', 'Tasks', taskId, { parentTask: null }]
                ]);

                // Recharger depuis Grist afin que la hiérarchie, les colonnes projet
                // et la navigation utilisent immédiatement l'état réellement enregistré.
                await loadAllData();
                rebuildChildrenCache();

                // Reprendre la tâche transformée, sans perdre son projet ni ses autres données.
                const refreshed = tasks.find(t => t.id === taskId);
                if (refreshed) {
                    panelState.editData = cloneTaskData(refreshed);
                    panelState.taskId = taskId;
                    selectedTaskId = taskId;

                        const col = cols.find(c => String(c.key) === key);

                            panelState.columnTasks = col.tasks;
                            panelState.taskIndex = col.tasks.findIndex(t => t.id === taskId);
                        }
                    }
                }

                renderPanelTask();
                render();
                showSaveIndicator();
                showToast('La sous-tâche est maintenant une tâche principale', 'success');

                // En cas d'échec, restaurer l'état local connu pour éviter une disparition visuelle.
                task.parentTask = panelState.editData?.parentTask || null;
                if (panelState.editData) panelState.editData.parentTask = task.parentTask;

        // KAN-03: Clic direct sur barre de progression
        async function setCardProgress(e, taskId) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.round((clickX / rect.width) * 100);
            const roundedPercent = Math.round(percent / 5) * 5;  // Arrondir à 5%
            const clampedPercent = Math.max(0, Math.min(100, roundedPercent));
            
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            task.progression = clampedPercent;
            if (task.progression === 100 && !TF.isTerminal(statusCfg, task.statut)) task.statut = statusCfg.terminalValue;
            
            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, { progression: clampedPercent, statut: task.statut }]]);
                    showToast(`${clampedPercent}%`, 'success');
                } catch (err) {
                    showToast('Erreur', 'error');
                }
            }
            render();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════
        async function initGrist() {
            // Phase 1 : tenter grist.ready — si Grist absent, basculer en démo
            try {
                await grist.ready({ requiredAccess: 'full' });
            } catch (e) {
                console.log('Grist unavailable, using demo:', e);
                useDemoMode();
                return;
            }
            // #7 respect des droits : bandeau lecture seule + garde transverse sur toutes les ecritures.
            TF.readOnlyBanner();
            TF.guardWrites(grist, {
                onReadOnly: () => showToast('Lecture seule : modification non autorisee', 'error'),
                onDenied: () => { showToast('Modification refusee par vos droits', 'error'); loadAllData(); }
            });
            // Phase 2 : ici on est dans Grist. Toute erreur est logguée mais ne bascule PAS en démo.
            // En lecture seule, on ne tente pas de creer le schema (ecritures bloquees).
            if (!TF.isReadOnly()) { try { await ensureSchema(); } catch (e) { console.error('ensureSchema error (continuing):', e); showToast('Schéma: ' + (e?.message || e), 'error'); } }
            try { CRA_ACTIVE = (await grist.docApi.listTables()).includes('TimeEntries'); } catch (e) {}
            try { await loadAllData(); await persistInitialProjectOrder(); } catch (e) { console.error('loadAllData error (continuing):', e); showToast('Chargement: ' + (e?.message || e), 'error'); }
            try {
                grist.onRecords(async () => await loadAllData());
                grist.onRecord((rec) => { if (rec?.id && rec.id !== selectedTaskId) { selectedTaskId = rec.id; render(); } });
                grist.onOptions((options, interaction) => {
                    if (options?.filters && interaction?.source !== 'self') {
                        const f = options.filters;
                        filters.project = Array.isArray(f.project) ? f.project : [];
                        filters.priority = Array.isArray(f.priority) ? f.priority : [];
                        filters.assignee = Array.isArray(f.assignee) ? f.assignee : [];
                        updateFilterMenus();
                        render();
                    }
                });
                { const s = document.getElementById('colorSelect'); if (s) s.value = colorMode; }
                { const s = document.getElementById('levelSelect'); if (s) s.value = workLevel; }
            } catch (e) { console.error('Grist listeners error:', e); }
        }
